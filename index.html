<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Path & Destiny Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <main class="generator-container">
            <header>
                <h1>Destiny & Life Path Readings</h1>
                <p>Enter your exact date of birth to calculate your cosmic profile, relationships, and timeline.</p>
            </header>

            <div class="control-panel">
                <input type="date" id="dob-input" required>
                <button id="generate-btn">Calculate Profile</button>
            </div>

            <div id="output-card" class="output-card hidden">
                <div class="card-header">
                    <h2 id="output-sign">Zodiac Sign</h2>
                    <span id="output-element" class="element-badge">Element</span>
                </div>
                
                <div class="reading-section">
                    <h3>💘 Love Life & Relationships</h3>
                    <p id="love-text"></p>
                </div>

                <div class="reading-section">
                    <h3>⏳ Longevity & Core Timeline</h3>
                    <p id="timeline-text"></p>
                </div>

                <div class="meta-metrics">
                    <div><strong>Calculated Lifespan:</strong> <span id="meta-age">--</span> years</div>
                    <div><strong>Lucky Year:</strong> <span id="meta-year">--</span></div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
